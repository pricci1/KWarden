app-id: cl.tri.kwarden
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: kwarden
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: kwarden
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .github
          - .flatpak-builder
          - build
          - build-*
          - flatpak-build-dir
          - flatpak-repo
          - public
          - repo
